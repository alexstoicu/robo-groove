<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robo Groove">
<link rel="apple-touch-icon" href="icon.png">
<title>Robo Groove</title>
<style>
:root{
  --bg:#1b1640; --stage1:#2a2063; --stage2:#5a2f8a; --panel:#241d52; --panel2:#2f2766;
  --ink:#fff; --muted:#b9b2e6;
  --beat:#9b5de5; --head:#00b4d8; --arm:#ff8c42; --leg:#06d6a0; --keys:#f15bb5; --gtr:#fee440;
  --slot:#3a3180; --glow:#ffe066;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:clamp(10px,2vh,20px);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{display:grid;grid-template-rows:1fr auto auto;height:100vh;height:100dvh;gap:.45rem;padding:.45rem}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- STAGE ---------- */
#stage{position:relative;border-radius:var(--r);overflow:hidden;min-height:0;
  background:radial-gradient(ellipse at 50% 110%,#ff7ab655 0,transparent 55%),linear-gradient(180deg,var(--stage1),var(--stage2));
  display:flex;align-items:flex-end;justify-content:space-evenly;padding:0 1rem}
#stage::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#stage.flash::after{opacity:.07;transition:none}
#floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#00000000,#00000055)}
#fxlayer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ring{position:absolute;left:58%;top:55%;width:12rem;height:12rem;margin:-6rem 0 0 -6rem;border-radius:50%;border:5px solid #7df9ff;opacity:0}
.echo{position:absolute;font-size:2.2rem;font-weight:900;color:#ffe066;opacity:0;text-shadow:0 0 10px #ffe06699}
.char{position:relative;z-index:1;overflow:visible;cursor:pointer}
.band{height:70%;max-width:22%;margin-bottom:1%}
.robot{height:96%;max-width:30%;display:none}
.robot.on{display:block}
.char g{transform-box:view-box}
.robot g{transform-box:fill-box}
.robot .head{transform-origin:50% 70%}
.robot .eyes{transform-origin:50% 50%}
.robot .rig,.robot .mover{transform-origin:50% 100%}
.robot .legL,.robot .legR,.robot .legs{transform-origin:50% 0%}
#robotA .armL,#robotA .armR{transform-origin:50% 6%}
#robotB .armL{transform-origin:100% 0%} #robotB .armR{transform-origin:0% 0%}
.robot .shape{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}
.char.selected{filter:drop-shadow(0 0 10px #ffe06688)}
#skins{position:absolute;left:.8rem;top:.7rem;display:flex;gap:.5rem;z-index:2}
#skins button{background:#ffffff1f;border-radius:12px;padding:.3rem .7rem;font-weight:700;border:3px solid transparent;font-size:.95rem}
#skins button.sel{border-color:var(--glow);background:#ffffff33}
#title{position:absolute;left:50%;transform:translateX(-50%);top:.6rem;font-weight:900;font-size:1.3rem;letter-spacing:.05em;color:#ffffffaa;z-index:2}
#tempoBtn{position:absolute;right:.8rem;top:.6rem;z-index:2;border-radius:12px;padding:.35rem .9rem;font-weight:900;font-size:1rem;background:#ffffff26;border:3px solid #ffffff55}
@keyframes flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.wings{animation:flutter .32s ease-in-out infinite}
.fairyFloat{animation:float 2s ease-in-out infinite}
.tail{animation:sway 1.6s ease-in-out infinite}

/* ---------- PALETTE ---------- */
#palette{background:var(--panel);border-radius:var(--r);padding:.4rem .5rem .5rem;display:flex;flex-direction:column;gap:.4rem}
#tabbar{display:flex;gap:.4rem;align-items:center}
.tab{border-radius:12px;padding:.3rem .85rem;font-weight:800;font-size:1rem;background:#ffffff14;border:3px solid transparent;white-space:nowrap}
.tab.sel{background:#ffffff2e;border-color:var(--glow)}
#subtabs{display:flex;gap:.3rem;margin-left:auto;background:#00000033;padding:.2rem;border-radius:12px}
.sub{border-radius:9px;padding:.25rem .8rem;font-weight:800;font-size:.9rem}
.sub.sel.head{background:var(--head)} .sub.sel.arm{background:var(--arm)} .sub.sel.leg{background:var(--leg);color:#103}
#genreBtn{margin-left:auto;border-radius:12px;padding:.3rem 1rem;font-weight:900;font-size:1rem;background:#ffffff26;border:3px solid #ffffff55}
.blocks{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem;min-height:3.9rem}
.blocks.loops{grid-template-columns:repeat(9,1fr)}
.block{touch-action:none;border-radius:12px;height:3.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:.8rem;box-shadow:0 4px 0 #0005;position:relative;transition:transform .08s;text-align:center;line-height:1.05}
.block .ic{font-size:1.55rem;line-height:1.1;pointer-events:none}
.block span{pointer-events:none}
.block .wv{position:absolute;top:.15rem;right:.3rem;font-size:.6rem;opacity:.85;font-weight:700;pointer-events:none}
.block:active{transform:translateY(2px)}
.block.head{background:var(--head)} .block.arm{background:var(--arm)} .block.leg{background:var(--leg);color:#103}
.block.drums{background:var(--beat)} .block.keys{background:var(--keys)} .block.guitar{background:var(--gtr);color:#3a2a00}
.block.off{background:#4a4370}
.block.sel{outline:4px solid #fff;outline-offset:-4px;box-shadow:0 0 16px #fff9,0 4px 0 #0005}

/* ---------- TIMELINE ---------- */
#timeline{display:flex;flex-direction:column;gap:.35rem;background:var(--panel);border-radius:var(--r);padding:.45rem .6rem .5rem}
#songbar{display:flex;gap:.5rem;align-items:center}
#mode{display:flex;background:#00000040;border-radius:12px;padding:.2rem;gap:.2rem;flex:0 0 auto}
#mode button{border-radius:9px;padding:.3rem .65rem;font-weight:900;font-size:.88rem;color:#ffffffaa}
#mode button.sel{background:var(--glow);color:#1b1640}
#chips{flex:1;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:.15rem}
#chips::-webkit-scrollbar{display:none}
.chip2{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:.3rem;height:2.5rem;padding:0 .55rem;border-radius:12px;
  background:var(--c);color:#1b1640;font-weight:800;overflow:hidden;border:3px solid transparent;opacity:.8}
.chip2.sel{border-color:#fff;box-shadow:0 0 12px #fff8;opacity:1}
.chip2 b{font-size:1.25rem}
.chip2 .bars,.chip2 .mood{font-size:.76rem;background:#ffffff77;border-radius:8px;padding:.15rem .4rem;white-space:nowrap}
.chip2 .bandic{font-size:.85rem;letter-spacing:-.1em}
.chip2 .ctl{display:flex;gap:.2rem;margin-left:.15rem}
.chip2 .ctl button{width:1.85rem;height:1.85rem;border-radius:8px;background:#1b164026;font-size:.85rem;color:#1b1640;font-weight:900}
.chip2 .prog{position:absolute;left:0;bottom:0;height:5px;background:#1b1640aa;width:0}
#addSec{flex:0 0 auto;border-radius:12px;padding:.42rem .8rem;font-weight:900;font-size:.9rem;background:#2ec26e;box-shadow:0 3px 0 #0006}
#rulerRow{display:flex;gap:.5rem;align-items:center}
#rulerLab{flex:0 0 auto;font-size:1.1rem}
#ruler{position:relative;flex:1;height:1.75rem;border-radius:8px;background:#00000040;overflow:hidden;touch-action:none}
.rseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:4px;font-size:.72rem;font-weight:900;color:#1b1640;
  border-right:2px solid #1b1640;opacity:.75;pointer-events:none}
.rseg.sel{opacity:1}
#loopRange{position:absolute;top:0;bottom:0;background:#ffe06650;border:3px solid #ffe066;border-radius:6px;pointer-events:none;display:none}
#cursor{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff;pointer-events:none}
#rhead{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#ef476f;box-shadow:0 0 8px #ef476f;pointer-events:none;display:none}
#loopPill{flex:0 0 11.5rem;width:11.5rem;text-align:center;overflow:hidden;text-overflow:ellipsis;border-radius:10px;padding:.25rem .6rem;font-weight:800;font-size:.8rem;background:#ffffff14;color:var(--muted);white-space:nowrap}
#loopPill.on{background:var(--glow);color:#1b1640}
#tlmain{display:grid;grid-template-columns:auto 1fr;gap:.6rem}
#controls{display:flex;flex-direction:column;gap:.35rem;justify-content:center}
#play{width:6rem;height:4.4rem;border-radius:14px;background:#2ec26e;font-size:1.3rem;font-weight:900;box-shadow:0 4px 0 #0006}
#play.on{background:#ef476f}
#clear{height:1.9rem;border-radius:10px;background:#ffffff1f;font-weight:700;font-size:.85rem}
#lanes{display:grid;grid-template-columns:2.5rem 1fr;row-gap:.22rem;column-gap:.4rem}
.lab{display:flex;align-items:center;justify-content:center;font-size:1.15rem;border-radius:10px}
.lab.head{background:#00b4d833} .lab.arm{background:#ff8c4233} .lab.leg{background:#06d6a033} .lab.fxl{background:#ffffff14}
#nums,.lane{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem}
#nums div{text-align:center;font-size:.7rem;color:var(--muted);font-weight:700}
#nums div.down{color:#fff}
#trackwrap{position:relative;display:grid;row-gap:.22rem}
.slot{position:relative;height:2.3rem;border-radius:10px;background:var(--slot);border:3px dashed #ffffff2a;
  display:flex;align-items:center;justify-content:center;touch-action:none;transition:background .15s}
.slot.hover{background:#5b51b0;border-color:var(--glow)}
.slot.filled{border-style:solid;border-color:transparent}
.slot.filled.head{background:var(--head)} .slot.filled.arm{background:var(--arm)} .slot.filled.leg{background:var(--leg);color:#103}
.slot .chip{display:flex;align-items:center;gap:.25rem;font-weight:800;font-size:.8rem;pointer-events:none}
.slot .chip .ic{font-size:1.15rem}
.slot .x{position:absolute;top:-.4rem;right:-.4rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#1b1640;font-size:.65rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff6;color:#fff}
.slot.active{box-shadow:0 0 0 3px var(--glow),0 0 16px var(--glow)}
#playhead{position:absolute;top:-.2rem;bottom:-.2rem;left:0;width:4px;margin-left:-2px;border-radius:2px;background:var(--glow);
  box-shadow:0 0 10px var(--glow);opacity:0;pointer-events:none;will-change:transform;transform:translate3d(0,0,0);z-index:3}
#playhead.on{opacity:1}
.fxcell{display:flex;gap:.25rem;justify-content:center;background:#ffffff0d;border-radius:10px;padding:2px}
.fx{flex:1;height:1.7rem;border-radius:9px;background:#ffffff10;font-size:.95rem;opacity:.45;border:2px solid transparent}
.fx.on{opacity:1}
.fx.rev.on{background:#00b4d8aa;border-color:#7df9ff}
.fx.dly.on{background:#ffd166aa;border-color:#ffe066}

#ghost{position:fixed;left:0;top:0;width:5rem;height:3.9rem;border-radius:12px;pointer-events:none;z-index:50;display:none;
  align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:.85rem;opacity:.92;
  box-shadow:0 10px 24px #0008;will-change:transform}
#ghost .ic{font-size:1.6rem}

#popbg{position:fixed;inset:0;z-index:80;background:#0005}
#pop{position:fixed;z-index:81;background:var(--panel2);border:3px solid #ffffff33;border-radius:18px;padding:.7rem;box-shadow:0 14px 40px #000a;max-width:96vw}
#pop h4{font-size:.9rem;color:var(--muted);margin:0 0 .5rem .2rem;text-transform:uppercase;letter-spacing:.08em}
.pgrid{display:grid;gap:.45rem}
.pgrid button{border-radius:12px;background:#ffffff1a;font-weight:800;padding:.5rem .6rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem;justify-content:center;border:3px solid transparent;line-height:1.1}
.pgrid button .ic{font-size:1.5rem}
.pgrid button small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.pgrid button.sel{border-color:var(--glow);background:#ffffff33}
.prow{display:flex;gap:.45rem;margin-top:.5rem;align-items:center;justify-content:center}
.prow button{border-radius:12px;background:#ffffff1a;font-weight:900;padding:.5rem 1rem;font-size:1.1rem}
.prow .big{font-size:1.6rem;font-weight:900;min-width:6rem;text-align:center}

.overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;
  background:radial-gradient(circle at 50% 40%,#5a2f8a,#1b1640 70%)}
.overlay h1{font-size:3.5rem;font-weight:900;letter-spacing:.04em}
.overlay p{color:var(--muted);font-size:1.1rem}
#startBtn{font-size:2rem;font-weight:900;padding:1rem 3rem;border-radius:999px;background:#2ec26e;box-shadow:0 6px 0 #0006}
#rotate{display:none}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
.hidden{display:none!important}
</style>
</head>
<body>

<section id="stage">
  <div id="floor"></div>
  <div id="skins">
    <button data-skin="A" class="sel">🤖 Robot A</button>
    <button data-skin="B">🎀 Robot B</button>
  </div>
  <div id="title">ROBO GROOVE</div>
  <button id="tempoBtn">🏃 120 BPM ▾</button>

  <!-- ===== Teddy bear on drums ===== -->
  <svg id="bear" class="char band" data-tab="drums" viewBox="0 0 260 300" aria-label="Teddy bear drummer">
    <ellipse cx="130" cy="292" rx="105" ry="8" fill="#0006"/>
    <g class="bBody">
      <ellipse cx="130" cy="178" rx="58" ry="60" fill="#b07a4f"/>
      <ellipse cx="130" cy="190" rx="36" ry="38" fill="#e2b98f"/>
    </g>
    <g class="bHead" style="transform-origin:130px 140px">
      <circle cx="88" cy="58" r="20" fill="#b07a4f"/><circle cx="88" cy="58" r="10" fill="#e2b98f"/>
      <circle cx="172" cy="58" r="20" fill="#b07a4f"/><circle cx="172" cy="58" r="10" fill="#e2b98f"/>
      <circle cx="130" cy="96" r="48" fill="#b07a4f"/>
      <ellipse cx="130" cy="114" rx="23" ry="17" fill="#e2b98f"/>
      <ellipse cx="130" cy="106" rx="9" ry="6" fill="#3b2314"/>
      <path d="M121 120 q9 8 18 0" stroke="#3b2314" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="111" cy="88" r="6" fill="#3b2314"/><circle cx="149" cy="88" r="6" fill="#3b2314"/>
      <circle cx="113" cy="86" r="2" fill="#fff"/><circle cx="151" cy="86" r="2" fill="#fff"/>
    </g>
    <!-- hi-hat (right) -->
    <g class="hat" style="transform-origin:205px 182px">
      <line x1="205" y1="182" x2="205" y2="285" stroke="#8d99ae" stroke-width="4"/>
      <ellipse cx="205" cy="178" rx="36" ry="7" fill="#ffd166" stroke="#c99a1e" stroke-width="3"/>
      <ellipse cx="205" cy="186" rx="36" ry="7" fill="#ffd166" stroke="#c99a1e" stroke-width="3"/>
    </g>
    <!-- snare (left) -->
    <g class="snare" style="transform-origin:60px 230px">
      <line x1="60" y1="240" x2="60" y2="285" stroke="#8d99ae" stroke-width="4"/>
      <rect x="22" y="218" width="76" height="26" rx="6" fill="#00b4d8" stroke="#0077b6" stroke-width="3"/>
      <ellipse cx="60" cy="218" rx="38" ry="10" fill="#f1faee" stroke="#0077b6" stroke-width="3"/>
    </g>
    <!-- arms with sticks -->
    <g class="bArmL" style="transform-origin:90px 152px">
      <line x1="90" y1="152" x2="66" y2="196" stroke="#b07a4f" stroke-width="22" stroke-linecap="round"/>
      <line x1="64" y1="196" x2="38" y2="214" stroke="#f3d19c" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g class="bArmR" style="transform-origin:170px 152px">
      <line x1="170" y1="152" x2="192" y2="190" stroke="#b07a4f" stroke-width="22" stroke-linecap="round"/>
      <line x1="194" y1="190" x2="222" y2="174" stroke="#f3d19c" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- bass drum (front) -->
    <g class="kick" style="transform-origin:130px 240px">
      <circle cx="130" cy="240" r="50" fill="#ff5d73" stroke="#fff" stroke-width="7"/>
      <circle cx="130" cy="240" r="33" fill="#ffd6dd"/>
      <path d="M130 216 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#ffd166"/>
    </g>
  </svg>

  <!-- ===== Fairy on keyboard ===== -->
  <svg id="fairy" class="char band" data-tab="keys" viewBox="0 0 260 300" aria-label="Fairy keyboard player">
    <ellipse cx="130" cy="292" rx="100" ry="8" fill="#0006"/>
    <g class="fairyFloat" style="transform-origin:130px 150px">
      <g class="wings" style="transform-origin:130px 140px">
        <ellipse cx="88" cy="118" rx="38" ry="26" fill="#a0e7ff" opacity=".75" transform="rotate(-25 88 118)"/>
        <ellipse cx="172" cy="118" rx="38" ry="26" fill="#a0e7ff" opacity=".75" transform="rotate(25 172 118)"/>
        <ellipse cx="96" cy="158" rx="24" ry="16" fill="#cdb4ff" opacity=".75" transform="rotate(20 96 158)"/>
        <ellipse cx="164" cy="158" rx="24" ry="16" fill="#cdb4ff" opacity=".75" transform="rotate(-20 164 158)"/>
      </g>
      <path d="M130 118 L92 212 Q130 224 168 212 Z" fill="#c77dff"/>
      <path d="M130 118 L108 170 L152 170 Z" fill="#e0aaff"/>
      <g class="fHead" style="transform-origin:130px 112px">
        <circle cx="130" cy="70" r="38" fill="#ff70a6"/>
        <circle cx="130" cy="30" r="15" fill="#ff70a6"/>
        <circle cx="130" cy="80" r="28" fill="#ffe0c7"/>
        <path d="M104 66 q26 -26 52 0 q-26 -12 -52 0z" fill="#ff70a6"/>
        <path d="M130 40 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#ffe066"/>
        <circle cx="119" cy="80" r="4.5" fill="#3a2a4a"/><circle cx="141" cy="80" r="4.5" fill="#3a2a4a"/>
        <circle cx="112" cy="92" r="5" fill="#ff8fab" opacity=".7"/><circle cx="148" cy="92" r="5" fill="#ff8fab" opacity=".7"/>
        <path d="M123 95 q7 6 14 0" stroke="#c9184a" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <g class="fHandL" style="transform-origin:114px 135px">
        <line x1="114" y1="135" x2="96" y2="196" stroke="#ffe0c7" stroke-width="9" stroke-linecap="round"/>
      </g>
      <g class="fHandR" style="transform-origin:146px 135px">
        <line x1="146" y1="135" x2="164" y2="196" stroke="#ffe0c7" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
    <!-- keyboard -->
    <line x1="70" y1="235" x2="55" y2="288" stroke="#8d99ae" stroke-width="5"/>
    <line x1="190" y1="235" x2="205" y2="288" stroke="#8d99ae" stroke-width="5"/>
    <rect x="30" y="196" width="200" height="42" rx="9" fill="#3a3180" stroke="#f15bb5" stroke-width="4"/>
    <g class="keys"></g>
    <g class="sparkles"></g>
  </svg>

  <!-- ===== Robot A: boxy ===== -->
  <svg id="robotA" class="char robot on" data-tab="robot" viewBox="0 0 300 360" aria-label="Robot A">
    <ellipse cx="150" cy="345" rx="95" ry="11" fill="#0006"/>
    <g class="mover"><g class="rig">
      <g class="legL">
        <rect x="110" y="272" width="26" height="54" rx="8" fill="#5b6b7a"/>
        <rect x="96" y="318" width="52" height="20" rx="10" fill="#34495e"/>
      </g>
      <g class="legR">
        <rect x="164" y="272" width="26" height="54" rx="8" fill="#5b6b7a"/>
        <rect x="152" y="318" width="52" height="20" rx="10" fill="#34495e"/>
      </g>
      <rect x="136" y="140" width="28" height="26" fill="#5b6b7a"/>
      <g class="torso">
        <rect x="84" y="160" width="132" height="120" rx="20" fill="#36d1c4" stroke="#1d7d75" stroke-width="5"/>
        <rect x="108" y="186" width="84" height="54" rx="10" fill="#1f2d3d"/>
        <circle class="pl" cx="127" cy="213" r="9" fill="#ff5d73"/>
        <circle class="pl" cx="150" cy="213" r="9" fill="#ffd166"/>
        <circle class="pl" cx="173" cy="213" r="9" fill="#06d6a0"/>
        <rect x="118" y="252" width="64" height="8" rx="4" fill="#1d7d75"/>
      </g>
      <g class="head">
        <line x1="150" y1="40" x2="150" y2="62" stroke="#5b6b7a" stroke-width="7"/>
        <circle class="light" cx="150" cy="34" r="12" fill="#ff5d73"/>

/* =====================================================================
   AUDIO GRAPH
   ===================================================================== */
let ctx = null, master = null, noiseBuf = null, BUS = null, DUCK = null, OUT = null, DIST = null, DLY = null, REV = null;
function setupAudio(c){
  ctx = c;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ctx.createGain(); master.gain.value = 0.5;
  const clip = ctx.createWaveShaper(), cc = new Float32Array(2048);
  for(let i=0;i<2048;i++){ const x = i/1023.5-1; cc[i] = Math.abs(x) < .7 ? x : Math.sign(x)*(.7 + .3*Math.tanh((Math.abs(x)-.7)/.3)); }
  clip.curve = cc; clip.oversample = "2x";
  master.connect(comp); comp.connect(clip); clip.connect(ctx.destination);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
  const len = Math.floor(ctx.sampleRate*2.4), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3); }
  REV = ctx.createConvolver(); REV.buffer = ir;
  const revOut = ctx.createGain(); revOut.gain.value = 0.5; REV.connect(revOut); revOut.connect(master);
  DLY = ctx.createDelay(2); DLY.delayTime.value = SIX*3;
  const fb = ctx.createGain(); fb.gain.value = 0.42;
  const dlp = ctx.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 3200;
  DLY.connect(dlp); dlp.connect(fb); fb.connect(DLY);
  const dOut = ctx.createGain(); dOut.gain.value = 0.5; dlp.connect(dOut); dOut.connect(master);
  BUS = [0,1,2,3].map(f => { const g = ctx.createGain(); g.connect(master); if(f&1) g.connect(REV); if(f&2) g.connect(DLY); return g; });
  DUCK = BUS.map(b => { const g = ctx.createGain(); g.connect(b); return g; });   // keys + guitar go through these (EDM pump)
  OUT = BUS[0];
  DIST = new Float32Array(1024);
  for(let i=0;i<1024;i++){ const x = i/511.5-1; DIST[i] = Math.tanh(x*3); }
}
function setTempo(b){
  BPM = Math.max(60, Math.min(180, Math.round(b)));
  SIX = 60/BPM/SUB; STEP_DUR = SIX*SUB;
  if(DLY && ctx) DLY.delayTime.setTargetAtTime(SIX*3, ctx.currentTime, .05);
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
function env(g, t, a, peak, dec){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function tone(type, f0, f1, t, dur, peak, dest){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, 0.004, peak, dur);
  o.connect(g); g.connect(dest || OUT);
  o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function noise(t, dur, peak, ftype, freq, q, f1, att){
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.setValueAtTime(freq, t); if(q) f.Q.value = q;
  if(f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, att || 0.002, peak, dur);
  s.connect(f); f.connect(g); g.connect(OUT);
  s.start(t, Math.random()*0.5); s.stop(t + (att||0) + dur + 0.05);
}
function clapSound(t, peak){
  [0,0.011,0.022].forEach(d=>noise(t+d,0.02,peak,"bandpass",1300,1.2));
  noise(t+0.03,0.14,peak*0.85,"bandpass",1300,1.2);
}

/* ---------- drum voices ---------- */
function drum(d, t, vel, kitName){
  const K = KITS[kitName] || KITS.pop, v = vel;
  switch(d){
    case "k": { const [f0,f1,dec,g,click] = K.k || KITS.pop.k;
      tone("sine", f0, f1, t, dec, g*v); if(click) tone("triangle", 1100, 220, t, .02, click*v);
      if(K.duck) for(const n of DUCK){ n.gain.cancelScheduledValues(t); n.gain.setValueAtTime(.25, t); n.gain.linearRampToValueAtTime(1, t + Math.min(.3, STEP_DUR*.8)); }
      break; }
    case "s": { const [tf,nf,nd,body] = K.s || KITS.pop.s;
      noise(t, nd, .5*v, "highpass", nf); tone("triangle", tf, tf*.65, t, .09, body*v); break; }
    case "r": tone("triangle", 1900, 1500, t, .03, .5*v); noise(t, .03, .3*v, "bandpass", 2600, 2); break;
    case "c": clapSound(t, .42*v); break;
    case "h": { const [f,dec,g=1] = K.h || [8000,.04]; noise(t, dec, .2*v*g, "highpass", f); break; }
    case "o": noise(t, K.o || .22, .15*v, "highpass", 7000); break;
    case "x": noise(t, 1.2, .22*v, "highpass", 5000); noise(t, .7, .08*v, "bandpass", 9000, 1); break;
    case "y": noise(t, .55, .09*v, "bandpass", 6500, 2); tone("sine", 3150, null, t, .25, .05*v); tone("sine", 4730, null, t, .15, .03*v); break;
    case "t": { const [f0,f1,dec,g] = K.t || [140,85,.3,.75]; tone("sine", f0, f1, t, dec, g*v); if(K.t) noise(t, .07, .25*v, "lowpass", 500); break; }
    case "m": { const [f0,f1,dec,g] = K.m || [220,150,.25,.65]; tone("sine", f0, f1, t, dec, g*v); break; }
    case "q": tone("sine", 260, 200, t, .22, .7*v); noise(t, .02, .2*v, "bandpass", 1800, 1); break;
    case "n": tone("sine", 460, 400, t, .12, .55*v); break;
    case "b": { const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = 1.5; f.connect(OUT);
      tone("square", 800, null, t, .2, .22*v, f); tone("square", 540, null, t, .2, .22*v, f); break; }
    case "w": tone("sine", 2500, null, t, .04, .45*v); tone("triangle", 1250, null, t, .03, .15*v); break;
    case "z": noise(t, .05, .14*v, "highpass", 6000, 0, 0, .02); break;
    case "a": noise(t, .1, .16*v, "bandpass", 9000, 3); noise(t, .05, .1*v, "highpass", 6000); break;
    case "p": noise(t, .12, .2*v, "bandpass", 3000, .7, 0, .03); break;
    case "u": { // riser: two bars of rising filtered noise
      const dur = SIX*32, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; s.loop = true; f.type = "bandpass"; f.Q.value = 2;
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.22*v, t + dur); g.gain.setValueAtTime(0.0001, t + dur + .01);
      s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t + dur + .05); break; }
  }
}

let visQ = [];
function playInst(inst, ref, p, t, mood){
  const list = compile(inst, ref, mood)[p];
  if(!list.length) return;
  const bus = OUT, busIdx = BUS.indexOf(bus);
  const trim = ctx.createGain(); trim.gain.value = TRIM[ref.g+"/"+inst+"/"+ref.v] || 1;
  let dest = inst === "drums" || busIdx < 0 ? bus : DUCK[busIdx];
  const kit = KITS[DRUMS[ref.g].kit], lp = inst === "drums" ? kit.lp : (KEYS[ref.g].lp && inst === "keys") || (GTRS[ref.g].lp && inst === "guitar") ? 2600 : 0;
  if(lp){ const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; f.connect(dest); dest = f; }
  trim.connect(dest);
  if(inst === "drums" && kit.room && REV){ const send = ctx.createGain(); send.gain.value = kit.room; trim.connect(send); send.connect(REV); }
  OUT = trim;
  for(const e of list){
    if(inst === "drums"){
      drum(e.d, t, e.vel, DRUMS[ref.g].kit);
      if(e.roll) drum(e.d, t + SIX/2, e.vel*.8, DRUMS[ref.g].kit);
      visQ.push({t, drum:e.d});
    } else if(inst === "keys"){
      const TM = TIM[e.tim]; e.notes.forEach(m => voice(TM, m, t, e.dur*SIX*.95));
      visQ.push({t, keys:e.hand, midi:e.notes[0]});
    } else {
      const S = GTRS[ref.g];
      playGuitar(e, t, e.pick && S.pkTone ? S.pkTone : S.tone, S.wah);
      visQ.push({t, gtr:e.dir});
    }
  }
  if(inst === "drums" && kit.crackle && Math.random() < .35) noise(t + Math.random()*SIX, .004, .12, "highpass", 2500);
  OUT = bus;
}
function swingOf(s){
  const g = (s.drums && s.drums.g) || (s.keys && s.keys.g) || (s.guitar && s.guitar.g);
  return g && DRUMS[g].swing;
}
function swingOffset(sw, p){
  if(!sw) return 0;
  const [type, amt] = sw;
  if(type === 16) return p % 2 === 1 ? amt*SIX : 0;
  return p % 4 === 2 ? amt*SIX : 0;
}

  blink:{cat:"head",label:"Blink",ic:"😉"}, grow:{cat:"head",label:"Grow",ic:"🎈"}, pulse:{cat:"head",label:"Pulse",ic:"💓"},

/* ---------- state ---------- */
const blank = (v=null) => Array(STEPS).fill(v);
function newSection(){
  return {bars:4, mood:"happy", head:blank(), arm:blank(), leg:blank(), rev:blank(false), dly:blank(false),
          drums:{g:"pop",v:0}, keys:{g:"pop",v:0}, guitar:null};
}
const state = { skin:"A", tab:"robot", sub:"head", mode:"loop", sections:[newSection()], cur:0,
                browse:{drums:"pop", keys:"pop", guitar:"pop"}, cursor:0, loop:null };
const sec = () => state.sections[state.cur];
const validRef = r => (r && GENRES[r.g] && Number.isInteger(r.v) && r.v >= 0 && r.v < 8) ? {g:r.g, v:r.v} : null;
const OLD_V = {drums:[0,2,4,7], keys:[0,2,4,6], guitar:[0,2,4,6]};          // stop-2 loop numbers → beta numbers
const OLD_BEATS = {basic:{g:"pop",v:0}, funky:{g:"funk",v:0}, bouncy:{g:"disco",v:0}, chill:{g:"lofi",v:0}};
function cleanSection(s, old){
  const n = newSection();
  for(const l of LANES) if(Array.isArray(s[l])) n[l] = Array.from({length:STEPS},(_,i)=> BLOCKS[s[l][i]] && BLOCKS[s[l][i]].cat===l ? s[l][i] : null);
  for(const f of ["rev","dly"]) if(Array.isArray(s[f])) n[f] = Array.from({length:STEPS},(_,i)=>!!s[f][i]);
  if(BAR_OPTIONS.includes(+s.bars)) n.bars = +s.bars;
  n.mood = MOODS[s.mood] ? s.mood : (old ? "adventure" : "happy");
  if(typeof s.drums === "string"){ n.drums = OLD_BEATS[s.drums] || null; n.keys = null; }
  else for(const i of INSTS) if(i in s){
    let r = s[i];
    if(old && r && OLD_V[i][r.v] !== undefined) r = {g:r.g, v:OLD_V[i][r.v]};
    n[i] = validRef(r);
  }
  return n;
}
function load(){
  try{
    let d = JSON.parse(localStorage.getItem(STORE_KEY) || "null"), old = false;
    if(!d){ d = JSON.parse(localStorage.getItem("roboGroove.v3") || localStorage.getItem("roboGroove.v2") || "null"); old = !!d; }
    if(d && Array.isArray(d.sections) && d.sections.length){
      state.sections = d.sections.slice(0, MAX_SECTIONS).map(s => cleanSection(s, old));
      state.cur = Math.min(Math.max(0, +d.cur||0), state.sections.length-1);
      if(d.skin==="A"||d.skin==="B") state.skin = d.skin;
      if(d.mode==="song") state.mode = "song";
      if(+d.bpm) setTempo(+d.bpm);
      state.cursor = Math.max(0, +d.cursor||0);
      if(d.loop && d.loop.b > d.loop.a) state.loop = {a:+d.loop.a, b:+d.loop.b};
      clampSongMarks();
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({skin:state.skin, mode:state.mode, sections:state.sections, cur:state.cur, bpm:BPM, cursor:state.cursor, loop:state.loop})); }catch(e){} }

/* ---------- audio context ---------- */
function initAudio(){
  if(ctx){ if(ctx.state !== "running" && ctx.resume) ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(_){}   // iPhone/iPad: play even with the silent switch on
  setupAudio(new AC({latencyHint:"interactive"}));
  if(ctx.state !== "running") ctx.resume();
}

function installShapes(svg){

const T = s => ({transform:s});

  jump:  p => [[p.mover,[T("translateY(0)"),T("translateY(-48px)"),T("translateY(0)")],"cubic-bezier(.3,.7,.4,1)"],

                ...(p.wheel ? [] : [[p.legL, rot([0,14,-14,14,0])],[p.legR, rot([0,14,-14,14,0])]])],

const running = new Map();
function animate(el, frames, dur, easing){

}
function doMove(name){
  const p = parts(), dur = STEP_DUR*1000*0.95;

/* =====================================================================
   SEQUENCER — loop one part, or play the song (with start point + loop range)
   ===================================================================== */
let playing = false, timer = null, nextTime = 0, gpos = 0, pendingJump = null;
let lastStep = -1, lastStepT = 0;
const songBars = () => state.sections.reduce((a,s) => a + s.bars, 0);
const secStartBar = idx => { let a = 0; for(let i=0;i<idx;i++) a += state.sections[i].bars; return a; };
function secAtBar(bar){ let a = 0; for(let i=0;i<state.sections.length;i++){ if(bar < a + state.sections[i].bars) return i; a += state.sections[i].bars; } return state.sections.length-1; }
function clampSongMarks(){
  const tot = songBars();
  state.cursor = Math.min(state.cursor, tot-1);
  if(state.loop){ state.loop.b = Math.min(state.loop.b, tot); if(state.loop.a >= state.loop.b) state.loop = null; }
}
function locate(g){
  if(state.mode === "loop") return {idx:state.cur, local:g % (sec().bars*16), abs: secStartBar(state.cur)*16 + g % (sec().bars*16)};
  let a = 0;
  for(let i=0;i<state.sections.length;i++){ const L = state.sections[i].bars*16; if(g < a+L) return {idx:i, local:g-a, abs:g}; a += L; }
  return {idx:0, local:0, abs:0};
}
function wrapSong(){
  const total = songBars()*16;
  if(state.loop){ const A = state.loop.a*16, B = Math.min(state.loop.b*16, total); if(gpos >= B || gpos < A) gpos = A; }
  else if(gpos >= total) gpos = 0;
}
function scheduleSixteenth(t){
  if(pendingJump !== null && gpos % SUB === 0){ gpos = pendingJump; pendingJump = null; }
  if(state.mode === "song") wrapSong();
  const {idx, local, abs} = locate(gpos), s = state.sections[idx];
  const p = local % PAT, rp = local % RPAT, step = rp >> 2;
  const ts = t + swingOffset(swingOf(s), p);
  OUT = BUS[(s.rev[step]?1:0) | (s.dly[step]?2:0)];
  for(const inst of INSTS) if(s[inst]) playInst(inst, s[inst], p, ts, s.mood);
  if(rp % SUB === 0){
    for(const l of LANES){ const b = s[l][step]; if(b) SFX[b](t); }
    visQ.push({t, step, idx, local, abs, strong: step%2===0, rev:s.rev[step], dly:s.dly[step]});
  }
  OUT = BUS[0];
  gpos++;
}
function scheduler(){ while(nextTime < ctx.currentTime + LOOKAHEAD){ scheduleSixteenth(nextTime); nextTime += SIX; } }
const outLatency = () => ctx ? (ctx.outputLatency || ctx.baseLatency || 0) : 0;
const playBtn = $("#play"), playhead = $("#playhead");
function play(){
  initAudio(); stopPreview();
  if(playing) return;
  playing = true; visQ = []; pendingJump = null;
  if(state.mode === "song"){
    gpos = state.cursor*16;
    if(state.loop && (state.cursor < state.loop.a || state.cursor >= state.loop.b)) gpos = state.loop.a*16;
  } else gpos = 0;
  nextTime = ctx.currentTime + 0.08;
  scheduler(); timer = setInterval(scheduler, 25);
  playBtn.textContent = "■ Stop"; playBtn.classList.add("on");
  $("#rhead").style.display = "block";
}
function stop(){
  playing = false; clearInterval(timer); timer = null; visQ = []; lastStep = -1;
  playBtn.textContent = "▶ Play"; playBtn.classList.remove("on");
  playhead.classList.remove("on"); setActive(-1);
  $("#rhead").style.display = "none";
  document.querySelectorAll(".chip2 .prog").forEach(p => p.style.width = 0);
}
playBtn.addEventListener("pointerup", () => playing ? stop() : play());

let activeStep = -1;
function setActive(i){
  if(activeStep >= 0) LANES.forEach(l => slots[l][activeStep].classList.remove("active"));
  activeStep = i;
  if(i >= 0) LANES.forEach(l => slots[l][i].classList.add("active"));
}
function fireStep(v){
  if(state.mode === "song" && v.idx !== state.cur && v.idx < state.sections.length){ state.cur = v.idx; renderSection(); }
  const s = state.sections[v.idx];
  setActive(v.step); lastStep = v.step; lastStepT = v.t; playhead.classList.add("on");
  beatPulse(v.strong, s);
  if(s) for(const l of LANES){ const b = s[l][v.step]; if(b) doMove(b); }
  if(v.rev) showRing();
  if(v.dly) showEcho();
  const chip = document.querySelector(`.chip2[data-i="${v.idx}"] .prog`);
  if(chip && s) chip.style.width = ((v.local+4)/(s.bars*16))*100 + "%";
  $("#rhead").style.left = ((v.abs+2)/(songBars()*16))*100 + "%";
}
const laneEl = l => document.querySelector(`.lane[data-lane=${l}]`);
let slotW = 0, gapW = 0;
function measure(){
  const lane = laneEl("head"), s0 = slots.head[0];
  if(s0){ slotW = s0.offsetWidth; gapW = (lane.clientWidth - slotW*STEPS)/(STEPS-1); }
}
function frame(){
  if(ctx){
    const now = ctx.currentTime - outLatency();
    for(let i=0; i<visQ.length; ){
      const v = visQ[i];
      if(v.t > now){ i++; continue; }
      visQ.splice(i,1);
      if(v.drum) drumHit(v.drum);
      else if(v.keys) keysHit(v.keys, v.midi);
      else if(v.gtr) gtrHit(v.gtr);
      else if(playing) fireStep(v);
    }
    if(playing && lastStep >= 0){
      const f = Math.min(1, Math.max(0, (now - lastStepT)/STEP_DUR));
      playhead.style.transform = `translate3d(${lastStep*(slotW+gapW) + f*slotW}px,0,0)`;
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- previews (when stopped) ---------- */
let pvBus = null;
function stopPreview(){
  if(!pvBus) return;
  const b = pvBus; pvBus = null;
  b.gain.setTargetAtTime(0, ctx.currentTime, .02); setTimeout(() => b.disconnect(), 400);
  visQ = visQ.filter(v => !v.pv);
}
function previewLoop(inst, ref){
  initAudio(); stopPreview();
  pvBus = ctx.createGain(); pvBus.connect(master);
  const keep = OUT, t0 = ctx.currentTime + .05, before = visQ.length, mood = sec().mood;
  const from = (inst === "drums" && (ref.v === 5 || ref.v === 7)) ? 32 : 0, sw = DRUMS[ref.g].swing;
  OUT = pvBus;
  for(let p=0;p<32;p++) playInst(inst, ref, from+p, t0 + p*SIX + swingOffset(sw, p), mood);
  OUT = keep;
  for(let i=before;i<visQ.length;i++) visQ[i].pv = true;
}
function preview(id){
  initAudio();
  SFX[id](ctx.currentTime + 0.01);

}

function renderRuler(){

    const left = a/tot*100, w = s.bars/tot*100; a += s.bars;

  }).join("");

  const lr = $("#loopRange"), pill = $("#loopPill");
  if(state.loop){
    lr.style.display = "block"; lr.style.left = (state.loop.a/tot*100) + "%"; lr.style.width = ((state.loop.b-state.loop.a)/tot*100) + "%";
    pill.classList.add("on"); pill.textContent = `🔁 bars ${state.loop.a+1}–${state.loop.b}  ✕`;
  } else {
    lr.style.display = "none"; pill.classList.remove("on"); pill.textContent = `📍 bar ${state.cursor+1} · drag to loop`;
  }
}
function setCursor(bar, jump){
  state.cursor = bar;
  const i = secAtBar(bar);
  if(i !== state.cur){ state.cur = i; renderSection(); } else renderRuler();
  if(jump && playing){
    if(state.mode === "loop"){ state.mode = "song"; renderChips(); }
    pendingJump = bar*16;
  }
  save();
}
(function rulerInput(){
  const el = $("#ruler");
  let down = null;
  const barAt = x => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(songBars()-1, Math.floor((x - r.left)/r.width*songBars()))); };
  el.addEventListener("pointerdown", e => { down = {x:e.clientX, bar:barAt(e.clientX), drag:false}; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener("pointermove", e => {
    if(!down) return;
    if(!down.drag && Math.abs(e.clientX - down.x) > 10) down.drag = true;
    if(down.drag){ const b = barAt(e.clientX); state.loop = {a:Math.min(down.bar,b), b:Math.max(down.bar,b)+1}; renderRuler(); }
  });
  const end = e => {
    if(!down) return;
    const d = down; down = null;
    if(d.drag){
      const b = barAt(e.clientX); state.loop = {a:Math.min(d.bar,b), b:Math.max(d.bar,b)+1};
      if(state.mode !== "song"){ state.mode = "song"; renderChips(); }
      setCursor(state.loop.a, true);
    } else {
      if(state.loop && (d.bar < state.loop.a || d.bar >= state.loop.b)) state.loop = null;
      setCursor(d.bar, true);
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { down = null; renderRuler(); });
  $("#loopPill").addEventListener("pointerup", () => { if(state.loop){ state.loop = null; save(); renderRuler(); } });
})();
function selectSection(i){
  if(i === state.cur) return;
  state.cur = i; state.cursor = secStartBar(i);
  if(playing && state.mode === "song") pendingJump = state.cursor*16;
  save(); renderSection();
  const c = document.querySelector(`.chip2[data-i="${i}"]`); if(c) c.scrollIntoView({block:"nearest", inline:"nearest"});
}
function renderSection(){ renderSlots(); renderFx(); renderChips(); renderPalette(); }
const cloneSec = s => JSON.parse(JSON.stringify(s));
function barsPicker(anchor, title, current, onPick){
  openPop(anchor, `<h4>${title}</h4><div class="pgrid" style="grid-template-columns:repeat(7,1fr)">` +
    BAR_OPTIONS.map(b => `<button data-v="${b}" class="${b===current?"sel":""}" style="flex-direction:column;gap:0"><span class="ic">${b}</span>bars</button>`).join("") + `</div>`,
    v => onPick(+v));
}
function moodPicker(anchor, i){
  openPop(anchor, `<h4>🎼 How should part ${letter(i)} feel?</h4><div class="pgrid" style="grid-template-columns:repeat(4,1fr)">` +
    Object.entries(MOODS).map(([k,m]) => `<button data-v="${k}" class="${k===state.sections[i].mood?"sel":""}"><span class="ic">${m.ic}</span>${m.label}</button>`).join("") + `</div>`,
    v => { state.sections[i].mood = v; save(); renderChips(); if(!playing && sec().keys) previewLoop("keys", sec().keys); });
}
let chipDown = null;
$("#chips").addEventListener("pointerdown", e => { chipDown = {x:e.clientX, y:e.clientY}; });
$("#chips").addEventListener("pointerup", e => {
  if(!chipDown || Math.hypot(e.clientX-chipDown.x, e.clientY-chipDown.y) > 12) return;
  const c = e.target.closest(".chip2"); if(!c) return;
  const i = +c.dataset.i, actEl = e.target.closest("[data-act]"), act = actEl && actEl.dataset.act;
  if(i !== state.cur || !act){ selectSection(i); return; }
  const S = state.sections;
  if(act === "left" && i > 0){ [S[i-1], S[i]] = [S[i], S[i-1]]; state.cur = i-1; }
  else if(act === "right" && i < S.length-1){ [S[i+1], S[i]] = [S[i], S[i+1]]; state.cur = i+1; }
  else if(act === "copy" && S.length < MAX_SECTIONS){ S.splice(i+1, 0, cloneSec(S[i])); state.cur = i+1; }
  else if(act === "del" && S.length > 1){ S.splice(i, 1); state.cur = Math.min(i, S.length-1); }
  else if(act === "bars"){ barsPicker(actEl, `How long is part ${letter(i)}?`, S[i].bars, b => { S[i].bars = b; save(); renderChips(); }); return; }
  else if(act === "mood"){ moodPicker(actEl, i); return; }
  state.cursor = secStartBar(state.cur);
  save(); renderSection();
});
$("#addSec").addEventListener("pointerup", e => {
  barsPicker(e.currentTarget, "New section — how many bars?", 4, b => {
    if(state.sections.length >= MAX_SECTIONS) return;
    const n = cloneSec(sec()); n.bars = b;
    state.sections.splice(state.cur+1, 0, n); state.cur++; state.cursor = secStartBar(state.cur);
    save(); renderSection();
  });
});
document.querySelectorAll("#mode button").forEach(b => b.addEventListener("pointerup", () => {
  if(state.mode === b.dataset.m) return;
  state.mode = b.dataset.m;
  if(playing){ if(state.mode === "song") pendingJump = secStartBar(state.cur)*16; else gpos = 0; }
  save(); renderChips();
}));

/* ---------- robot lanes & effects ---------- */
function buildSlots(){
  const nums = $("#nums");
  for(let i=0;i<STEPS;i++){ const n = document.createElement("div"); n.textContent = i+1; if(i%4===0) n.className = "down"; nums.appendChild(n); }
  for(const l of LANES){
    const lane = laneEl(l);
    for(let i=0;i<STEPS;i++){
      const s = document.createElement("div");
      s.className = "slot"; s.dataset.i = i; s.dataset.lane = l;
      lane.appendChild(s); slots[l].push(s);
      draggable(s, () => sec()[l][i] ? {id:sec()[l][i], lane:l, from:i} : null, e => {
        if(e && e.target.closest(".x")){ sec()[l][i] = null; save(); renderSlots(); return; }
        if(sec()[l][i]) preview(sec()[l][i]);
        else { state.tab = "robot"; state.sub = l; renderPalette(); }
      });
    }
  }
  const fx = $("#fxrow");
  for(let i=0;i<STEPS;i++){
    const c = document.createElement("div"); c.className = "fxcell";
    c.innerHTML = `<button class="fx rev" data-i="${i}" aria-label="Reverb">🌊</button><button class="fx dly" data-i="${i}" aria-label="Echo">⛰️</button>`;
    fx.appendChild(c);
  }
  fx.addEventListener("pointerup", e => {
    const b = e.target.closest(".fx"); if(!b) return;
    const k = b.classList.contains("rev") ? "rev" : "dly", i = +b.dataset.i;
    sec()[k][i] = !sec()[k][i]; save(); renderFx();
    if(sec()[k][i]){ initAudio(); const keep = OUT; OUT = BUS[k==="rev"?1:2]; tone("triangle",660,null,ctx.currentTime+.01,.1,.35); OUT = keep; k==="rev" ? showRing() : showEcho(); }
  });
}
function renderFx(){
  document.querySelectorAll("#fxrow .fx").forEach(b => {
    const k = b.classList.contains("rev") ? "rev" : "dly";
    b.classList.toggle("on", !!sec()[k][+b.dataset.i]);
  });
}
function renderSlots(){
  for(const l of LANES) slots[l].forEach((s,i) => {
    const id = sec()[l][i], wasActive = s.classList.contains("active");
    s.className = "slot" + (id ? " filled " + l : "") + (wasActive ? " active" : "");
    s.innerHTML = id ? `<div class="chip"><span class="ic">${BLOCKS[id].ic}</span>${BLOCKS[id].label}</div><button class="x" aria-label="Remove">✕</button>` : "";
  });
}
function renderSkins(){
  document.querySelectorAll("#skins button").forEach(b => b.classList.toggle("sel", b.dataset.skin === state.skin));
  $("#robotA").classList.toggle("on", state.skin === "A");
  $("#robotB").classList.toggle("on", state.skin === "B");
}
document.querySelectorAll("#skins button").forEach(b => b.addEventListener("pointerup", () => { state.skin = b.dataset.skin; save(); renderSkins(); }));
$("#clear").addEventListener("pointerup", () => { LANES.forEach(l => sec()[l].fill(null)); sec().rev.fill(false); sec().dly.fill(false); save(); renderSlots(); renderFx(); });

/* ---------- pointer drag (multi-touch safe) ---------- */
function slotAt(x, y){ const el = document.elementFromPoint(x, y); return el ? el.closest(".slot") : null; }
const COLORS = {head:"--head", arm:"--arm", leg:"--leg"};
function draggable(el, getPayload, onTap){
  el.addEventListener("pointerdown", e => {
    if(e.button > 0) return;
    if(e.target.closest(".x")){ const up = ev => { el.removeEventListener("pointerup", up); onTap(ev); }; el.addEventListener("pointerup", up); return; }
    const payload = getPayload(), id = e.pointerId, sx = e.clientX, sy = e.clientY;
    let dragging = false, hover = null;
    try{ el.setPointerCapture(id); }catch(_){}
    const move = ev => {
      if(ev.pointerId !== id || !payload) return;
      if(!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10){
        dragging = true;
        const def = BLOCKS[payload.id];
        ghost.innerHTML = `<div class="ic">${def.ic}</div>${def.label}`;
        ghost.style.background = getComputedStyle(document.documentElement).getPropertyValue(COLORS[def.cat]);
        ghost.style.color = def.cat === "leg" ? "#103" : "#fff";
        ghost.style.display = "flex";
      }
      if(dragging){
        ghost.style.transform = `translate3d(${ev.clientX - ghost.offsetWidth/2}px,${ev.clientY - ghost.offsetHeight/2}px,0) rotate(-4deg)`;
        let s = slotAt(ev.clientX, ev.clientY);
        if(s) s = slots[payload.lane][+s.dataset.i];
        if(s !== hover){ hover && hover.classList.remove("hover"); hover = s; hover && hover.classList.add("hover"); }
      }
    };
    const end = (ev, cancelled) => {
      if(ev.pointerId !== id) return;
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", upH); el.removeEventListener("pointercancel", cancelH);
      hover && hover.classList.remove("hover");
      if(dragging){
        ghost.style.display = "none";
        if(!cancelled){
          const s = slotAt(ev.clientX, ev.clientY), arr = sec()[payload.lane];
          if(s){
            const to = +s.dataset.i;
            if(payload.from >= 0){ const tmp = arr[to]; arr[to] = payload.id; arr[payload.from] = tmp; }
            else { arr[to] = payload.id; preview(payload.id); }
          } else if(payload.from >= 0) arr[payload.from] = null;
          save(); renderSlots();
        }
      } else if(!cancelled) onTap(ev);
    };
    const upH = ev => end(ev, false), cancelH = ev => end(ev, true);
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", upH); el.addEventListener("pointercancel", cancelH);
  });
}

/* ---------- lifecycle ---------- */
$("#startBtn").addEventListener("pointerdown", () => {
  initAudio();
  $("#start").classList.add("hidden");
  SFX.bob(ctx.currentTime + 0.02); doMove("bob");
  measure();
});
document.addEventListener("pointerdown", () => { if(ctx && ctx.state !== "running") ctx.resume(); }, true);
document.addEventListener("visibilitychange", () => { if(document.hidden){ if(playing) stop(); if(ctx) ctx.suspend(); } });
window.addEventListener("resize", () => { measure(); renderRuler(); });
document.addEventListener("contextmenu", e => e.preventDefault());

load();
fxLayer = document.createElement("div"); fxLayer.id = "fxlayer"; stageEl.prepend(fxLayer);
installShapes($("#robotA")); installShapes($("#robotB")); buildBand();
buildSlots(); renderSkins(); renderTempo(); renderSection(); measure();
requestAnimationFrame(frame);

</script>
</body>
